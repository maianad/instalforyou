<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instal For You · Stranica u izradi</title>
<meta name="description" content="Instal For You – stranica je u izradi.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --lime:#d2ec51;
    --dark:#2b2b2b;
    --dark2:#363636;
    --gray:#8a8a8a;
    --light:#f5f6f9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Montserrat',sans-serif;
    background:radial-gradient(ellipse at 70% 40%, #3d3d3d 0%, var(--dark) 60%, #1f1f1f 100%);
    color:var(--light);
    min-height:100vh;
    overflow-x:hidden;
    display:flex;flex-direction:column;
  }
  /* blueprint grid */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(210,236,81,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(210,236,81,.05) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:28px clamp(20px,5vw,64px);position:relative;z-index:2;
  }
  .logo{font-weight:500;letter-spacing:.02em;font-size:18px}
  .logo b{color:var(--lime);font-weight:600}
  .badge{
    font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid rgba(210,236,81,.5);color:var(--lime);
    padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;
  }
  .badge i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.2}}

  main{
    flex:1;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;
    gap:clamp(20px,4vw,60px);padding:0 clamp(20px,5vw,64px) 40px;position:relative;z-index:2;
  }
  .eyebrow{color:var(--lime);font-weight:500;font-size:15px;margin-bottom:18px}
  h1{
    font-weight:800;font-size:clamp(38px,5.6vw,76px);line-height:1.02;letter-spacing:-.02em;margin-bottom:22px;
  }
  h1 span{color:var(--lime);display:block}
  .lead{font-size:clamp(16px,1.4vw,19px);line-height:1.6;color:#cfcfcf;max-width:30em;margin-bottom:34px}

  .call{
    display:inline-flex;align-items:center;gap:18px;text-decoration:none;
    background:var(--lime);color:var(--dark);
    padding:18px 28px 18px 18px;border-radius:14px;
    box-shadow:0 10px 0 #9fb52f,0 24px 40px rgba(0,0,0,.4);
    transition:transform .15s,box-shadow .15s;
  }
  .call:hover{transform:translateY(4px);box-shadow:0 6px 0 #9fb52f,0 16px 30px rgba(0,0,0,.4)}
  .call:active{transform:translateY(10px);box-shadow:0 0 0 #9fb52f,0 8px 20px rgba(0,0,0,.4)}
  .call .ico{
    width:54px;height:54px;border-radius:10px;background:var(--dark);display:grid;place-items:center;flex:none;
  }
  .call .ico svg{width:26px;height:26px;fill:var(--lime);animation:ring 2.4s infinite}
  @keyframes ring{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-14deg)}80%{transform:rotate(14deg)}85%{transform:rotate(-10deg)}90%{transform:rotate(8deg)}}
  .call small{display:block;font-size:13px;font-weight:600;opacity:.75}
  .call strong{display:block;font-size:clamp(20px,2vw,26px);font-weight:800;letter-spacing:.01em}

  .services{
    margin-top:40px;display:flex;flex-wrap:wrap;gap:8px;max-width:34em;
  }
  .services span{
    font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.06);color:#d9d9d9;
    border:1px solid rgba(255,255,255,.08);
  }

  /* 3D scene */
  .scene{perspective:1200px;display:flex;justify-content:center}
  .rig{
    width:100%;max-width:640px;transform-style:preserve-3d;
    transform:rotateX(8deg) rotateY(-14deg);transition:transform .25s ease-out;
    filter:drop-shadow(0 40px 40px rgba(0,0,0,.5));
  }
  .rig svg{width:100%;height:auto;display:block;overflow:visible}

  .flow{stroke-dasharray:14 22;animation:flow 1.1s linear infinite}
  .flow.slow{animation-duration:1.8s}
  @keyframes flow{to{stroke-dashoffset:-36}}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin 6s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes spin{0%{transform:rotate(0)}40%,100%{transform:rotate(360deg)}}
  .needle{transform-box:view-box;transform-origin:478px 118px;animation:needle 3s ease-in-out infinite}
  @keyframes needle{0%,100%{transform:rotate(-50deg)}35%{transform:rotate(40deg)}45%{transform:rotate(28deg)}55%{transform:rotate(46deg)}}
  .drop{animation:drop 1.8s cubic-bezier(.55,0,1,.45) infinite}
  @keyframes drop{0%{transform:translateY(0) scale(.2);opacity:0}15%{transform:translateY(0) scale(1);opacity:1}70%{opacity:1}85%,100%{transform:translateY(64px) scale(1,1.15);opacity:0}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 1.8s ease-out infinite;opacity:0}
  .ripple.r2{animation-delay:.2s}
  @keyframes ripple{0%,78%{transform:scale(.1);opacity:0}82%{opacity:.9}100%{transform:scale(1.6);opacity:0}}
  .wrench{transform-box:fill-box;transform-origin:20% 80%;animation:wrench 2.2s ease-in-out infinite}
  @keyframes wrench{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
  .spark{animation:spark 2.2s infinite}
  @keyframes spark{0%,40%,100%{opacity:0}48%{opacity:1}56%{opacity:0}}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}

  footer{
    padding:22px clamp(20px,5vw,64px);display:flex;justify-content:center;text-align:center;
    font-size:13px;color:var(--gray);position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.06)
  }
  footer a{color:var(--gray)}

  @media (max-width:900px){
    main{grid-template-columns:1fr;text-align:left}
    .scene{order:-1;margin:-10px -10px 0}
    .rig{max-width:480px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="logo">INSTAL<b>FOR</b>YOU</div>
  <div class="badge"><i></i>U izradi</div>
</header>

<main>
  <section>
    <h1>Nova stranica<span>je u izradi.</span></h1>
    <p class="lead">Dok spajamo zadnje cijevi i zatežemo spojeve, dostupni smo vam telefonom.</p>

    <a class="call" href="tel:+38598650502">
      <span class="ico">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      </span>
      <span>
        <small>Krunoslav Vugrinec</small>
        <strong>098 650 502</strong>
      </span>
    </a>

  </section>

  <div class="scene" aria-hidden="true">
    <div class="rig" id="rig">
      <svg viewBox="0 0 600 460">
        <defs>
          <linearGradient id="metalV" x1="0" x2="1">
            <stop offset="0" stop-color="#5c5c5c"/><stop offset=".35" stop-color="#e9e9e9"/>
            <stop offset=".55" stop-color="#b9b9b9"/><stop offset="1" stop-color="#4a4a4a"/>
          </linearGradient>
          <linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5c5c5c"/><stop offset=".35" stop-color="#ececec"/>
            <stop offset=".55" stop-color="#bdbdbd"/><stop offset="1" stop-color="#454545"/>
          </linearGradient>
          <radialGradient id="knob" cx=".35" cy=".35" r=".8">
            <stop offset="0" stop-color="#f2ffb0"/><stop offset=".5" stop-color="#d2ec51"/><stop offset="1" stop-color="#7d8f22"/>
          </radialGradient>
          <radialGradient id="gaugeFace" cx=".4" cy=".35" r=".8">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfcfcf"/>
          </radialGradient>
          <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e9ff8a"/><stop offset="1" stop-color="#d2ec51"/>
          </linearGradient>
          <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="480"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- floor shadow -->
        <ellipse cx="300" cy="430" rx="250" ry="20" fill="#000" opacity=".35"/>

        <!-- wall plate -->
        <g class="float">
          <rect x="22" y="40" width="70" height="300" rx="10" fill="#444" stroke="#555"/>
          <circle cx="40" cy="60" r="4" fill="#666"/><circle cx="74" cy="60" r="4" fill="#666"/>
          <circle cx="40" cy="320" r="4" fill="#666"/><circle cx="74" cy="320" r="4" fill="#666"/>
        </g>

        <!-- MAIN PIPE NETWORK (outer metal) -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- shadow -->
          <path d="M92 120 H300 V300 H520 V340" stroke="#000" stroke-width="40" opacity=".25" transform="translate(6,8)"/>
          <path d="M92 250 H190 V380 H420" stroke="#000" stroke-width="30" opacity=".25" transform="translate(6,8)"/>
          <!-- pipe body -->
          <rect x="92" y="102" width="208" height="36" fill="url(#metalH)" stroke="none"/>
          <rect x="282" y="120" width="36" height="180" fill="url(#metalV)" stroke="none"/>
          <rect x="300" y="282" width="220" height="36" fill="url(#metalH)" stroke="none"/>
          <rect x="502" y="300" width="36" height="38" fill="url(#metalV)" stroke="none"/>
          <rect x="92" y="237" width="98" height="26" fill="url(#metalH)" stroke="none"/>
          <rect x="177" y="250" width="26" height="130" fill="url(#metalV)" stroke="none"/>
          <rect x="190" y="367" width="230" height="26" rx="13" fill="url(#metalH)" stroke="none"/>
          <!-- elbows -->
          <circle cx="300" cy="120" r="24" fill="url(#metalV)" stroke="none"/>
          <circle cx="300" cy="300" r="24" fill="url(#metalV)" stroke="none"/>
          <circle cx="520" cy="300" r="24" fill="url(#metalV)" stroke="none"/>
          <circle cx="190" cy="250" r="18" fill="url(#metalV)" stroke="none"/>
          <circle cx="190" cy="380" r="18" fill="url(#metalV)" stroke="none"/>
        </g>

        <!-- glass windows with flowing water -->
        <g fill="none" stroke-linecap="round">
          <path d="M110 120 H280" stroke="#1d1d1d" stroke-width="12"/>
          <path d="M110 120 H280" stroke="#d2ec51" stroke-width="7" class="flow" filter="url(#glow)"/>
          <path d="M300 140 V280" stroke="#1d1d1d" stroke-width="12"/>
          <path d="M300 140 V280" stroke="#d2ec51" stroke-width="7" class="flow" filter="url(#glow)"/>
          <path d="M320 300 H500" stroke="#1d1d1d" stroke-width="12"/>
          <path d="M320 300 H500" stroke="#d2ec51" stroke-width="7" class="flow" filter="url(#glow)"/>
          <path d="M110 250 H175" stroke="#1d1d1d" stroke-width="9"/>
          <path d="M110 250 H175" stroke="#ff8a5c" stroke-width="5" class="flow slow"/>
          <path d="M190 265 V365" stroke="#1d1d1d" stroke-width="9"/>
          <path d="M190 265 V365" stroke="#ff8a5c" stroke-width="5" class="flow slow"/>
          <path d="M205 380 H400" stroke="#1d1d1d" stroke-width="9"/>
          <path d="M205 380 H400" stroke="#ff8a5c" stroke-width="5" class="flow slow"/>
        </g>

        <!-- couplings / nuts -->
        <g fill="#2f2f2f" stroke="#d2ec51" stroke-width="2">
          <rect x="196" y="98" width="20" height="44" rx="3"/>
          <rect x="278" y="200" width="44" height="20" rx="3"/>
          <rect x="400" y="278" width="20" height="44" rx="3"/>
          <rect x="300" y="364" width="16" height="32" rx="3"/>
        </g>

        <!-- valve wheel on top pipe -->
        <g>
          <rect x="140" y="70" width="10" height="34" fill="url(#metalV)"/>
          <g class="wheel">
            <circle cx="145" cy="62" r="30" fill="none" stroke="url(#knob)" stroke-width="9"/>
            <g stroke="#7d8f22" stroke-width="5" stroke-linecap="round">
              <line x1="145" y1="36" x2="145" y2="88"/><line x1="119" y1="62" x2="171" y2="62"/>
              <line x1="127" y1="44" x2="163" y2="80"/><line x1="163" y1="44" x2="127" y2="80"/>
            </g>
            <circle cx="145" cy="62" r="9" fill="url(#knob)"/>
          </g>
        </g>

        <!-- pressure gauge -->
        <g>
          <rect x="471" y="140" width="14" height="160" fill="url(#metalV)"/>
          <circle cx="478" cy="118" r="44" fill="#2f2f2f"/>
          <circle cx="478" cy="118" r="37" fill="url(#gaugeFace)"/>
          <path d="M447 136 A36 36 0 0 1 509 136" fill="none" stroke="#d2ec51" stroke-width="6"/>
          <path d="M498 100 A27 27 0 0 1 505 118" fill="none" stroke="#ff715b" stroke-width="5"/>
          <g stroke="#555" stroke-width="2">
            <line x1="448" y1="118" x2="455" y2="118"/><line x1="501" y1="118" x2="508" y2="118"/>
            <line x1="478" y1="88" x2="478" y2="95"/><line x1="457" y1="97" x2="462" y2="102"/><line x1="499" y1="97" x2="494" y2="102"/>
          </g>
          <line class="needle" x1="478" y1="118" x2="478" y2="90" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="478" cy="118" r="5" fill="#2b2b2b"/>
          <text x="478" y="146" text-anchor="middle" font-family="Montserrat" font-size="8" font-weight="600" fill="#666">BAR</text>
        </g>

        <!-- faucet at end -->
        <g>
          <rect x="500" y="336" width="40" height="12" rx="3" fill="#2f2f2f" stroke="#d2ec51" stroke-width="2"/>
          <path d="M520 348 v10 q0 10 -10 10 h-34" fill="none" stroke="url(#metalH)" stroke-width="16" stroke-linecap="round"/>
          <rect x="462" y="360" width="16" height="16" rx="3" fill="url(#metalV)"/>
          <ellipse class="drop" cx="470" cy="384" rx="5" ry="7" fill="url(#waterG)" filter="url(#glow)"/>
          <ellipse class="ripple" cx="470" cy="450" rx="26" ry="5" fill="none" stroke="#d2ec51" stroke-width="2"/>
          <ellipse class="ripple r2" cx="470" cy="450" rx="16" ry="3" fill="none" stroke="#d2ec51" stroke-width="2"/>
        </g>

        <!-- wrench working on coupling -->
        <g class="wrench">
          <path d="M318 352 l60 -60" stroke="#c9c9c9" stroke-width="12" stroke-linecap="round"/>
          <path d="M378 292 m-14 -2 a18 18 0 1 1 18 18 l-6 -6 a10 10 0 1 0 -6 -6z" fill="#c9c9c9"/>
        </g>
        <g class="spark" stroke="#d2ec51" stroke-width="3" stroke-linecap="round">
          <line x1="300" y1="356" x2="290" y2="346"/><line x1="296" y1="372" x2="282" y2="374"/><line x1="312" y1="366" x2="306" y2="352"/>
        </g>

        <!-- hard-hat sign -->
        <g class="float" style="animation-delay:-2s">
          <rect x="350" y="30" width="96" height="44" rx="8" fill="#d2ec51"/>
          <rect x="356" y="36" width="84" height="32" rx="5" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="6 4"/>
          <text x="398" y="57" text-anchor="middle" font-family="Montserrat" font-size="12" font-weight="800" fill="#2b2b2b">U IZRADI</text>
        </g>
      </svg>
    </div>
  </div>
</main>

<footer>
  <span>Instal For You · Čučerje, Zagreb</span>
</footer>

<script>
  // gentle 3D tilt that follows the mouse
  const rig = document.getElementById('rig');
  const base = {x:8, y:-14};
  window.addEventListener('pointermove', e => {
    const dx = (e.clientX / innerWidth - .5);
    const dy = (e.clientY / innerHeight - .5);
    rig.style.transform = `rotateX(${base.x - dy*14}deg) rotateY(${base.y + dx*22}deg)`;
  });
  document.addEventListener('pointerleave', () => {
    rig.style.transform = `rotateX(${base.x}deg) rotateY(${base.y}deg)`;
  });
</script>
</body>
</html>
